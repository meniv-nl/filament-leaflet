name: Sync upstream

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork with upstream
        run: gh repo sync "${{ github.repository }}" --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}